<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t d">
  <title id="t">skill-scout proposing a new skill</title>
  <desc id="d">A terminal session. The agent finishes a task, then asks whether to save the procedure as the skill terraform-plan-review. The user replies yes.</desc>
  <rect width="760" height="300" rx="10" fill="#0d1117"/>
  <rect width="760" height="32" rx="10" fill="#161b22"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="16" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="16" r="6" fill="#27c93f"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="24" y="66" fill="#8b949e">agent&gt; Plan reviewed with the on-call owner. Applied the saved plan.</text>
    <text x="24" y="100" fill="#58a6ff">skill-scout</text>
    <text x="112" y="100" fill="#c9d1d9">This looks reusable: review the saved Terraform plan</text>
    <text x="24" y="122" fill="#c9d1d9">with the on-call owner, then apply only that artifact.</text>
    <text x="24" y="144" fill="#c9d1d9">Save as</text>
    <text x="92" y="144" fill="#7ee787">terraform-plan-review</text>
    <text x="270" y="144" fill="#c9d1d9">(project skill)?</text>
    <text x="24" y="186" fill="#8b949e">you&gt;</text>
    <text x="68" y="186" fill="#c9d1d9">yes</text>
    <text x="24" y="228" fill="#7ee787">Saved .agents/skills/terraform-plan-review/SKILL.md</text>
    <text x="24" y="268" fill="#8b949e">Agent notices. Human decides. The skill library remembers.</text>
  </g>
</svg>
